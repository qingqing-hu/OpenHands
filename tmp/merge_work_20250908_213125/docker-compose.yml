services:
  openhands:
    build:
      context: ./
      dockerfile: ./containers/app/dev/Dockerfile
    image: openhands:latest
    container_name: openhands-app-${DATE:-}
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=${SANDBOX_RUNTIME_CONTAINER_IMAGE:-docker.all-hands.dev/all-hands-ai/runtime:0.55-nikolaik}
      #- SANDBOX_USER_ID=${SANDBOX_USER_ID:-1234} # enable this only if you want a specific non-root sandbox user but you will have to manually adjust permissions of ~/.openhands for this user
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_BASE:-$PWD/workspace}
      # Custom configuration for internal deployments
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKEND_LOG_FILE=${BACKEND_LOG_FILE:-/logs/backend.log}
      - FRONTEND_LOG_FILE=${FRONTEND_LOG_FILE:-/logs/frontend.log}
      - FRONTEND_BASE_PATH=${FRONTEND_BASE_PATH:-/openhands}
      - SANDBOX_LOCAL_RUNTIME_URL=${SANDBOX_LOCAL_RUNTIME_URL}
      # LLM Configuration (use environment variables for sensitive data)
      - SANDBOX_ENV_OPENAI_BASE_URL=${SANDBOX_ENV_OPENAI_BASE_URL}
      - SANDBOX_ENV_OPENAI_API_KEY=${SANDBOX_ENV_OPENAI_API_KEY}
      - SANDBOX_ENV_OPENAI_MODEL=${SANDBOX_ENV_OPENAI_MODEL}
      - SANDBOX_ENV_USE_TOKEN_AUTH=${SANDBOX_ENV_USE_TOKEN_AUTH}
      - SANDBOX_ENV_RESPONSE_WRAPPER_FIELD=${SANDBOX_ENV_RESPONSE_WRAPPER_FIELD}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_USE_TOKEN_AUTH=${LLM_USE_TOKEN_AUTH}
      - LLM_RESPONSE_WRAPPER_FIELD=${LLM_RESPONSE_WRAPPER_FIELD}
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
      - ${WORKSPACE_BASE:-$PWD/workspace}:/opt/workspace_base
      - ./logs:/logs
    pull_policy: build
    network_mode: bridge
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    labels:
      - "com.openhands.service=backend"
