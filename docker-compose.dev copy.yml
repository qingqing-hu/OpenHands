services:
  openhands:
    build:
      context: ./
      dockerfile: ./containers/app/dev/Dockerfile
      args:
        VITE_BASE_PATH: /openhands
    image: openhands:latest
    container_name: openhands-app-dev
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=${SANDBOX_RUNTIME_CONTAINER_IMAGE:-docker.all-hands.dev/all-hands-ai/runtime:0.50-nikolaik}
      - WORKSPACE_MOUNT_PATH=/tmp/openhands-workspace
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - SESSION_ID=${SESSION_ID:-default}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - FRONTEND_BASE_PATH=${FRONTEND_BASE_PATH:-/openhands}
      - VITE_BASE_PATH=/openhands
      - OPENHANDS_DEV_MODE=true
      - MOUNT_OPENHANDS_CODE=true
      - CONTAINER_NAME=openhands-app-dev
      - LLM_USE_TOKEN_AUTH=false
    ports:
      - "5002:5002"
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
      - /tmp/openhands-workspace:/opt/workspace_base
      - /tmp/openhands-workspace:/app/workspace
      # Mount the source code for development
      - ./openhands:/app/openhands
    working_dir: /app
    pull_policy: build
    stdin_open: true
    tty: true
    labels:
      - "com.openhands.service=backend"
