services:
  openhands:
    build:
      context: ./
      dockerfile: ./containers/app/prod/Dockerfile
      args:
        VITE_BASE_PATH: /openhands
    image: openhands:latest
    container_name: openhands-app-${DATE:-}
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=repositories-hub.myhexin.com:8081/all-hands-ai/runtime:0.55-nikolaik
      - RUNTIME_MOUNT=${RUNTIME_MOUNT:-$PWD/workspace:/workspace:rw}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKEND_LOG_FILE=/logs/backend.log
      - FRONTEND_LOG_FILE=/logs/frontend.log
      - FRONTEND_BASE_PATH=${FRONTEND_BASE_PATH:-/openhands}
      - SANDBOX_LOCAL_RUNTIME_URL=http://172.17.0.1
      - SANDBOX_ENV_OPENAI_BASE_URL=http://172.21.54.74:28000/vtuber/ai_access/kimi_moonshot/v1
      - SANDBOX_ENV_OPENAI_API_KEY=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJjdXJyZW50VGltZSI6MTc1NTUwMTMxODA1OCwiZXhwIjoxNzU2MTA2MTE4LCJ1c2VybmFtZSI6IjMifQ.2CPnYCx5NftL2Xdd8CvvYsf_ltO3yt8QMX_bOFOqs3U
      - SANDBOX_ENV_OPENAI_MODEL=moonshot/kimi-k2-0711-preview
      - SANDBOX_ENV_USE_TOKEN_AUTH=true
      - SANDBOX_ENV_RESPONSE_WRAPPER_FIELD=data
      - LLM_MODEL=moonshot/kimi-k2-0711-preview
      - LLM_BASE_URL=http://172.21.54.74:28000/vtuber/ai_access/kimi_moonshot/v1
      - LLM_API_KEY=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJjdXJyZW50VGltZSI6MTc1NTUwMTMxODA1OCwiZXhwIjoxNzU2MTA2MTE4LCJ1c2VybmFtZSI6IjMifQ.2CPnYCx5NftL2Xdd8CvvYsf_ltO3yt8QMX_bOFOqs3U
      - LLM_USE_TOKEN_AUTH=true
      - LLM_PROXY_HEADERS={"host":"arsenal-openai-server","X-Arsenal-Auth":"arsenal-tools"}
      - LLM_RESPONSE_WRAPPER_FIELD=data
      - MOUNT_OPENHANDS_CODE=true
      # Let auto-detection find the mount path, same as dev environment
      # - OPENHANDS_CODE_PATH=${PWD}/openhands
      - CONTAINER_NAME=openhands-app-dev
      - port=5000

    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
      - ${WORKSPACE_BASE:-$PWD/workspace}:/opt/workspace_base
      - ./logs:/logs
      - ./openhands:/app/openhands
    pull_policy: build
    network_mode: bridge
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    labels:
      - "com.openhands.service=backend"
