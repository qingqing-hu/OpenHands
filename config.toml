[core]
#workspace_base="./workspace"

# Debugging enabled
debug = false

# Disable color in terminal output
disable_color = false

# Maximum number of concurrent conversations per user
max_concurrent_conversations = 100

# Maximum age of conversations in seconds before they are automatically closed
conversation_max_age_seconds = 8640000  # 100 days


[llm]
# 使用内网代理访问kimi-k2模型
model = "kimi-k2-0711-preview"

# 使用token作为api_key（实际上是JWT token）
api_key = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJjdXJyZW50VGltZSI6MTc1NTUwMTMxODA1OCwiZXhwIjoxNzU2MTA2MTE4LCJ1c2VybmFtZSI6IjMifQ.2CPnYCx5NftL2Xdd8CvvYsf_ltO3yt8QMX_bOFOqs3U"

# 内网代理地址
base_url = "http://172.21.54.74:28000/vtuber/ai_access/kimi_moonshot/v1"

# 启用token认证模式（关键配置）
use_token_auth = true

# 指定响应包装字段（响应中实际数据在data字段中）
response_wrapper_field = "data"

# 可选：添加自定义请求头（使用内联字典格式）
proxy_headers = {"host" = "arsenal-openai-server", "X-Arsenal-Auth" = "arsenal-tools"}

# 重试配置（内网环境可能需要调整）
num_retries = 3
retry_min_wait = 2
retry_max_wait = 10

# Token限制配置
# 对话历史允许的最大token数，超过后触发压缩
conversation_token_limit = 100000

# 单次LLM请求允许的最大token数
single_request_token_limit = 50000

# 接近token限制时的警告阈值 (0-1)
token_warning_threshold = 0.8

# 当超过token限制时自动压缩对话
auto_compress_on_limit = true

# 启用详细的LLM请求和响应日志 (用于调试)
#nable_llm_request_logging = true

# 启用完整内容日志记录 (不截断，显示完整LLM输入内容)
enable_full_content_logging = true

# 重试策略配置
# 智能重试策略，针对不同错误类型采用不同处理方式
enable_intelligent_retry = true

# Token相关错误的重试等待时间（秒）
token_error_retry_wait = 2

# 网络错误的基础重试等待时间（秒）
network_error_base_wait = 5

[sandbox]
local_runtime_url = "http://172.17.0.1"
keep_runtime_alive = true

# Claude Code + MCP Integration
runtime_extra_deps = """
COPY ./claude-mcp-integration /claude-mcp-integration
RUN /claude-mcp-integration/install-claude-with-mcp.sh && rm -rf /claude-mcp-integration
RUN apt-get update && apt-get install -y jq && apt-get clean && rm -rf /var/lib/apt/lists/*
"""

[app]
port=3000
frontend_port=3001

[condenser]
# Semantic Condenser - Advanced semantic compression with importance analysis
type = "semantic"
# Reference to an LLM config to use for semantic analysis
llm_config = "condenser"
# Number of initial events to always keep (typically includes task description)
keep_first = 1
# Maximum size of history before triggering compression
max_size = 50
# Maximum compression ratio (0-1), controls compression strength
max_compression_ratio = 0.3
# Whether to enable semantic analysis for importance scoring
enable_semantic_analysis = true
# Maximum length of the event representations to be passed to the LLM
max_event_length = 4000
